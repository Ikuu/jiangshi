name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches jiangshiVersion
        run: |
          VERSION=$(sed -n 's/^val jiangshiVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match jiangshiVersion $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: null2264/actions/gradle-java-setup@240857a3fa6e2667311da86417c637d4f59e8d75
        with:
          java: 21
          distro: temurin

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Decode signing key
        env:
          STORE_BASE64: ${{ secrets.JIANGSHI_STORE_BASE64 }}
        run: |
          if [ -z "$STORE_BASE64" ]; then
            echo "::error::The JIANGSHI_STORE_BASE64 secret isn't set, so the APK can't be signed"
            exit 1
          fi
          echo "$STORE_BASE64" | base64 -d > "$RUNNER_TEMP/jiangshi.jks"
          echo "ORG_GRADLE_PROJECT_JIANGSHI_STORE_FILE=$RUNNER_TEMP/jiangshi.jks" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          ORG_GRADLE_PROJECT_JIANGSHI_STORE_PASSWORD: ${{ secrets.JIANGSHI_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_JIANGSHI_KEY_ALIAS: ${{ secrets.JIANGSHI_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_JIANGSHI_KEY_PASSWORD: ${{ secrets.JIANGSHI_KEY_PASSWORD }}
        run: ./gradlew assembleStandardRelease

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/standardRelease

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/standard/release/jiangshi-*.apk \
            --title "Jiangshi $GITHUB_REF_NAME" \
            --generate-notes
